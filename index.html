<!DOCTYPE html>
<meta property="og:title" content="Guess the Word 🎮">
<meta property="og:description" content="Can you guess the secret word?">
<meta property="og:image" content="https://lillyliliana383.github.io/guess-the-word/thumbnail.png">
<meta property="og:type" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxneUdMq9ppngVoXj0MYEtOpZmr8BfzmlaseGN29culg&s=10">
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Word</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
    }

    .game {
      width: 90%;
      max-width: 450px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255,255,255,0.1);
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #ddd;
    }

    input {
      width: 90%;
      padding: 15px;
      margin: 20px 0 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #facc15;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #fde047;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .win {
      color: #86efac;
    }

    .wrong {
      color: #fca5a5;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🎮 Guess the Word</h1>

    <p>Can you guess the secret word?</p>

    <input
      id="guess"
      type="text"
      placeholder="Enter your guess"
    >

    <button onclick="checkGuess()">GUESS</button>

    <div id="result"></div>
  </div>

  <script>
    function checkGuess() {
      const guess = document
        .getElementById("guess")
        .value
        .trim()
        .toLowerCase();

      const result = document.getElementById("result");

      if (guess === "gta67") {
        result.className = "win";
        result.textContent = "🎉 YOU WON! The word was GTA67!";
      } else {
        result.className = "wrong";
        result.textContent = "❌ Wrong! Try again.";
      }
    }

    document.getElementById("guess").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkGuess();
      }
    });
  </script>

</body>
</html>
